<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Livraria da Mata</title>
      <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Login Livraria da Mata</h1>
        <hr> 
    </header>
    <section>
        <h2>Acesse sua Conta</h2>
        <p>Insira seu e-mail e senha cadastrados para entrar na plataforma.</p>
    
        <form>
            <p>
                <label for="email">E-mail:</label><br>
                <input type="email" id="email" placeholder="Ex: nome@email.com" required>
            </p>
            <p>
                <label for="senha">Senha:</label><br>
                <input type="password" id="senha" placeholder="Digite sua senha" required>
            </p>
            <button type="submit">Entrar</button>
        </form>
    </section>
    <hr>
    <section>
        <p>Ainda não tem uma conta? <a href="cadastro.html">Clique aqui para se cadastrar</a>.</p>
    </section>
    <hr>
    <footer>
        <p>© 2026 Livraria da Mata - Sistema de Sebo Online</p>
    </footer>
</body>
</html>
